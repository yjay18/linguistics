name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Linguistics.slnx --locked-mode
      - run: dotnet build Linguistics.slnx --configuration Release --no-restore
      - run: dotnet test Linguistics.slnx --configuration Release --no-build
      - run: dotnet publish src/Linguistics.App/Linguistics.App.csproj --configuration Release --no-restore
