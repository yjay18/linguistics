name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Linguistics.slnx --locked-mode
      - run: dotnet build Linguistics.slnx --configuration Release --no-restore
      - run: dotnet test Linguistics.slnx --configuration Release --no-build
      - run: dotnet publish src/Linguistics.App/Linguistics.App.csproj --configuration Release --no-restore
      - name: Audit published licenses and notices
        shell: pwsh
        run: >-
          ./tools/ci/Test-PublishNotices.ps1
          -PublishDirectory src/Linguistics.App/bin/Release/net10.0/publish
      - name: Capture template gallery visual evidence
        id: gallery-capture
        shell: pwsh
        run: >-
          ./tools/ci/Capture-TemplateGallery.ps1
          -PublishDirectory src/Linguistics.App/bin/Release/net10.0/publish
          -OutputDirectory "${{ runner.temp }}/linguistics-gallery"
      - name: Upload template gallery visual evidence
        if: ${{ always() && steps.gallery-capture.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: template-gallery-${{ runner.os }}
          path: ${{ runner.temp }}/linguistics-gallery
          if-no-files-found: error
          retention-days: 14
